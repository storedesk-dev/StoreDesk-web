name: CI

# Public repo: runs cost no Actions minutes, so develop and production are
# both checked. Docs-only pushes are skipped. See docs/ci.md in the parent repo.

on:
  push:
    branches: [production, develop]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [production, develop]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run ci
