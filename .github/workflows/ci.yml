name: CI

# Checks only: nothing here deploys. Private repo (D-15), so runs bill: production
# and on demand only; the hooks gate develop. Docs-only pushes are skipped.
# Deploying is by hand (`npm run deploy`). See docs/ci.md in the parent repo.

on:
  push:
    branches: [production]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run ci
